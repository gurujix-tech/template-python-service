apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: template-python-service
  title: Gurujix Python Service
  description: Golden path for a FastAPI service matching the service-orders reference layout.
spec:
  owner: platform-team
  type: service

  parameters:
    - title: Service details
      required:
        - name
        - description
        - owner
        - system
      properties:
        name:
          title: Service name
          type: string
          description: Repository and component name (prefer service-* kebab-case).
          ui:field: EntityNamePicker
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Short summary for README and catalog-info.
        owner:
          title: Owner
          type: string
          description: Catalog Group that owns this service.
          default: storefront-team
        system:
          title: System
          type: string
          description: Catalog System this service belongs to.
          default: storefront
    - title: Repository location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - gurujix-tech

  steps:
    - id: fetch-base
      name: Render service skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main

    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
